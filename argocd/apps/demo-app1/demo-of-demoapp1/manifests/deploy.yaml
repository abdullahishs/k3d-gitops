apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-of-demoapp1
  namespace: apps-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-of-demoapp1
  template:
    metadata:
      labels:
        app: demo-of-demoapp1
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
