apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app2
  namespace: apps-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app2
  template:
    metadata:
      labels:
        app: demo-app2
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
